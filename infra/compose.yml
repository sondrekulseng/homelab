networks:
  default:
    ipam:
      config:
        - subnet: 172.30.50.0/24
          ip_range: 172.30.50.128/25

services:
  # Tailscale
  tailscale:
    image: tailscale/tailscale:v1.102.5
    container_name: tailscale
    hostname: homelab
    ports:
      - "41641:41641/udp"
    env_file:
      - ./tailscale/.env
    volumes:
      - ./tailscale/state:/var/lib/tailscale
      - ./tailscale/serve.json:/etc/tailscale/serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    profiles: [infra, media-slim]

  # DNS  
  pihole:
    container_name: pihole
    image: pihole/pihole:2026.09.0
    networks:
      default:
        ipv4_address: 172.30.50.2
    ports:
      # DNS port
      - "53:53"
      # HTTP Port
      - "81:81/tcp"
    env_file:
      - ./pihole/.env
    volumes:
      - './pihole:/etc/pihole'
    cap_add:
      # See https://docs.pi-hole.net/docker/configuration/#note-on-capabilities
      # Required if you are using Pi-hole as your NTP client to be able to set the host's system time
      - SYS_TIME
      # Optional, if Pi-hole should get some more processing time
      - SYS_NICE
    restart: unless-stopped
    profiles: [infra]

  # Notification service
  ntfy:
    image: binwiederhier/ntfy:v2.29.0
    container_name: ntfy
    command:
      - serve
    environment:
      - TZ=${TZ}
      - NTFY_BASE_URL=${TAILSCALE_URL}
      - NTFY_LISTEN_HTTP=:80
      - NTFY_BEHIND_PROXY=false
      - NTFY_UPSTREAM_BASE_URL=https://ntfy.sh
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
    user: ${PUID}:${PGID}
    volumes:
      - /var/cache/ntfy:/var/cache/ntfy
      - /etc/ntfy:/etc/ntfy
    ports:
      - 82:80
    restart: unless-stopped
    profiles: [infra, media]
