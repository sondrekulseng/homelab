networks:
  default:
    ipam:
      config:
        - subnet: 172.30.50.0/24
          ip_range: 172.30.50.128/25

services:
  # Tailscale
  tailscale:
    image: tailscale/tailscale:v1.104.2
    container_name: tailscale
    hostname: homelab
    ports:
      - "41641:41641/udp"
    env_file:
      - ./tailscale/.env
    volumes:
      - ./tailscale/state:/var/lib/tailscale
      - ./tailscale/serve.json:/etc/tailscale/serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    networks:
      default:
        ipv4_address: 172.30.50.3
    restart: unless-stopped
    profiles: [infra, media-slim]

  # DNS  
  pihole:
    container_name: pihole
    image: pihole/pihole:2026.10.0
    networks:
      default:
        ipv4_address: 172.30.50.2
    ports:
      # DNS port
      - "53:53/udp"
      # HTTP Port
      - "81:81/tcp"
    env_file:
      - ./pihole/.env
    volumes:
      - './pihole:/etc/pihole'
    cap_add:
      # See https://docs.pi-hole.net/docker/configuration/#note-on-capabilities
      # Required if you are using Pi-hole as your NTP client to be able to set the host's system time
      - SYS_TIME
      # Optional, if Pi-hole should get some more processing time
      - SYS_NICE
    restart: unless-stopped
    profiles: [infra]

  # Notification service
  ntfy:
    image: binwiederhier/ntfy:v2.34.0
    container_name: ntfy
    command:
      - serve
    environment:
      - TZ=${TZ}
      - NTFY_BASE_URL=${NTFY_BASE_URL}
      - NTFY_BEHIND_PROXY=true
      - NTFY_UPSTREAM_BASE_URL=https://ntfy.sh
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
    user: ${PUID}:${PGID}
    volumes:
      - /var/cache/ntfy:/var/cache/ntfy
      - /etc/ntfy:/etc/ntfy
    restart: unless-stopped
    profiles: [infra, media]

  # Notes app
  silverbullet:
    image: ghcr.io/silverbulletmd/silverbullet:2.12.1-slim
    container_name: silverbullet
    volumes:
      - ./silverbullet:/data
    restart: unless-stopped

  # Home assistant
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:2026.10.4
    restart: unless-stopped
    environment:
      - TZ=Europe/Oslo
    volumes:
      - ./homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "6667:6667/udp"
      - "6666:6666/udp"
      - "7000:7000/udp"
    profiles: [infra]

  # OpenCloud
  opencloud:
    container_name: opencloud
    image: opencloudeu/opencloud-rolling:8.1.0
    entrypoint: ["/bin/sh"]
    command: ["-c", "opencloud init || true; opencloud server"]
    environment:
      OC_URL: ${CLOUD_DOMAIN_HTTPS}
      OCIS_URL: ${CLOUD_DOMAIN_HTTPS}
      OC_INSECURE: false
      PROXY_TLS: true
      IDM_ADMIN_PASSWORD: ${IDM_ADMIN_PASSWORD}
      PROXY_CSP_CONFIG_FILE_LOCATION: /etc/opencloud/csp.yaml
      # Euro-Office
      EURO_OFFICE_DOMAIN: ${EURO_OFFICE_DOMAIN_HTTPS}
      OC_ADD_RUN_SERVICES: collaboration
      COLLABORATION_WOPI_SRC: ${CLOUD_DOMAIN_HTTPS}
      COLLABORATION_APP_NAME: Euro-Office
      COLLABORATION_APP_PRODUCT: OnlyOffice
      COLLABORATION_APP_ADDR: ${EURO_OFFICE_DOMAIN_HTTPS}
      COLLABORATION_APP_ICON: ${EURO_OFFICE_DOMAIN_HTTPS}/web-apps/apps/documenteditor/main/resources/img/favicon.ico
      COLLABORATION_APP_INSECURE: false
      COLLABORATION_CS3API_DATAGATEWAY_INSECURE: false
      COLLABORATION_APP_PROOF_DISABLE: true
      EURO_OFFICE_JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./opencloud/config:/etc/opencloud
      - ./test:/var/lib/opencloud
    security_opt:
      - no-new-privileges:true
    networks:
      default:
        ipv4_address: 172.30.50.4
    restart: unless-stopped
    profiles: [infra]

  euro-office:
    container_name: euro-office
    image: ghcr.io/euro-office/documentserver:v9.3.7
    environment:
      WOPI_ENABLED: true
      USE_UNAUTHORIZED_STORAGE: false
      JWT_SECRET: ${JWT_SECRET}
      VIRTUAL_HOST: ${EURO_OFFICE_DOMAIN}
      VIRTUAL_PORT: 80
    networks:
      default:
        ipv4_address: 172.30.50.5
    restart: unless-stopped
    profiles: [infra]

  nginx-proxy:
    container_name: nginx-proxy
    image: jc21/nginx-proxy-manager:2.16.0
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      # Proxy Manager Admin Web UI port
      - "83:81/tcp"
    environment:
      DISABLE_IPV6: false
    networks:
      default:
        ipv4_address: 172.30.50.10
    volumes:
      - ./npm/data:/data
      - ./npm/letsencrypt:/etc/letsencrypt
    profiles: [infra]
    restart: unless-stopped
